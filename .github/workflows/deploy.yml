name: Deploy para Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar pnpm
        run: npm install -g pnpm

      - name: Instalar dependências
        run: pnpm install

      - name: Gerar build
        run: pnpm build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyB01rRG-VNsNnloEGMrxmB-khoX3f7l8qo
          VITE_FIREBASE_AUTH_DOMAIN: controle-extras-dc02e.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: controle-extras-dc02e
          VITE_FIREBASE_STORAGE_BUCKET: controle-extras-dc02e.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 482520197386
          VITE_FIREBASE_APP_ID: 1:482520197386:web:864e92b1db65f0844472f3

      - name: Deploy para Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: controle-extras-dc02e
